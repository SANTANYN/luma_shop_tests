version: '3.9'

services:
  jenkins:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: luma_jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - .:/var/jenkins_home/workspace/luma_shop_tests
    user: root
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false

volumes:
  jenkins_home:
